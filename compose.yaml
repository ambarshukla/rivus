name: rivus

x-collector: &collector
  build:
    context: ./collectors
    target: runtime
  image: rivus-collector
  restart: unless-stopped
  environment: &collector-env
    KAFKA_BOOTSTRAP: kafka:9092
    METRICS_PORT: "8000"
  depends_on:
    kafka-init:
      condition: service_completed_successfully

services:
  # ---------------------------------------------------------------- transport
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
      VENUES: coinbase kraken bitstamp

  # --------------------------------------------------------------- collectors
  # One service per venue. To drop a venue, delete its service here and its
  # file in collectors/venues/.
  collector-coinbase:
    <<: *collector
    command: ["venues/coinbase.yaml"]

  collector-kraken:
    <<: *collector
    command: ["venues/kraken.yaml"]

  collector-bitstamp:
    <<: *collector
    command: ["venues/bitstamp.yaml"]

  # -------------------------------------------------------------------- tests
  collectors-test:
    profiles: ["test"]
    build:
      context: ./collectors
      target: test
    image: rivus-collector-test

volumes:
  kafka-data:
