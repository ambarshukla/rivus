version: 2

models:
  - name: trades
    description: Every trade in the hour, one row each, in one schema for all venues.
    columns:
      - name: venue
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["coinbase", "kraken", "bitstamp"]
      - name: pair
        data_tests: [not_null]
      - name: trade_id
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]
      - name: qty
        data_tests: [not_null]
      - name: side
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["buy", "sell"]
      - name: event_time
        data_tests: [not_null]

  - name: batch_bars_1m
    description: 1-minute bars rebuilt from the raw trades.
    columns:
      - name: trades
        data_tests: [not_null]

  - name: stream_bars_1m
    description: The stream's 1-minute bars for the hour, exported from ClickHouse.

  - name: recon_diffs
    description: Each bar field where stream and batch disagree, with a reason.
    columns:
      - name: classification
        data_tests:
          - accepted_values:
              arguments:
                values: ["late event", "gap", "rounding", "ordering", "unexplained"]

  - name: recon_runs
    description: Per venue and pair, how many bars agree for the hour.
