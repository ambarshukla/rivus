[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rivus-collect"
version = "0.1.0"
description = "Collects raw exchange WebSocket messages into Kafka"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15,<18",
    "confluent-kafka>=2.8,<3",
    "pyyaml>=6,<7",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.8"]

[tool.setuptools]
packages = ["rivus_collect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
