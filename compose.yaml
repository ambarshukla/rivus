name: rivus

# Images shared by several services are built by one of them only.
#
# Rebuilding: use  BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose up -d --build
# Without that variable every build gets a new image id even when nothing
# changed, so every container is restarted, and a restarted collector means
# missed trades. A plain "docker compose up -d" never restarts anything.
x-collector: &collector
  image: rivus-collector
  pull_policy: never
  restart: unless-stopped
  environment: &collector-env
    KAFKA_BOOTSTRAP: kafka:9092
    METRICS_PORT: "8000"
  depends_on:
    kafka-init:
      condition: service_completed_successfully

x-flink: &flink
  image: rivus-flink
  pull_policy: never
  restart: unless-stopped
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      rest.address: flink-jobmanager
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 2048m
      taskmanager.numberOfTaskSlots: 4
      parallelism.default: 1
      execution.checkpointing.interval: 30s
      execution.checkpointing.dir: file:///flink-state/checkpoints
      execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
      execution.checkpointing.num-retained: 2
      state.backend.type: hashmap
      metrics.reporters: prom
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249
  volumes:
    - flink-state:/flink-state

services:
  # ---------------------------------------------------------------- transport
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 60000
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
      VENUES: coinbase kraken bitstamp

  # --------------------------------------------------------------- collectors
  # One service per venue. To drop a venue, delete its service here and its
  # file in collectors/venues/.
  collector-coinbase:
    <<: *collector
    build:
      context: ./collectors
      target: runtime
    pull_policy: missing
    command: ["venues/coinbase.yaml"]

  collector-kraken:
    <<: *collector
    command: ["venues/kraken.yaml"]

  collector-bitstamp:
    <<: *collector
    command: ["venues/bitstamp.yaml"]

  # ------------------------------------------------------------------ process
  # A Flink session cluster: the job manager coordinates, the task manager does
  # the work, and flink-submit keeps the two SQL jobs submitted.
  flink-jobmanager:
    <<: *flink
    build:
      context: ./flink
    pull_policy: missing
    command: jobmanager
    ports:
      - "127.0.0.1:18081:8081"   # Flink web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flink-taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy

  flink-submit:
    <<: *flink
    entrypoint: ["/bin/bash", "/opt/flink/submit.sh"]
    depends_on:
      flink-taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------- stores
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment:
      # Local-only credentials: the ports below are bound to 127.0.0.1.
      CLICKHOUSE_USER: rivus
      CLICKHOUSE_PASSWORD: rivus
      CLICKHOUSE_DB: rivus
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    ports:
      - "127.0.0.1:18123:8123"   # HTTP interface
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user rivus --password rivus -q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Latest prices are rebuilt from the stream within a second: nothing to persist.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  latest:
    build:
      context: ./latest
      target: runtime
    image: rivus-latest
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REDIS_HOST: redis
      METRICS_PORT: "8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # --------------------------------------------------------------------- show
  # The only C# in the project: REST API, SignalR live feed and the web page.
  api:
    build:
      context: ./api
      target: runtime
    image: rivus-api
    restart: unless-stopped
    environment:
      Rivus__ClickHouseUrl: http://clickhouse:8123
      Rivus__ClickHouseUser: rivus
      Rivus__ClickHousePassword: rivus
      Rivus__Redis: redis:6379
    ports:
      - "127.0.0.1:18080:8080"   # the web page
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    environment:
      # Local only: anyone on this machine may look, nobody needs to log in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rivus.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------- reconcile
  # Airflow in its single-container "standalone" form (scheduler, API server
  # and DAG processor together, SQLite for its own records). Enough for one
  # laptop; a real deployment would run them separately on Postgres.
  airflow:
    build:
      context: ./batch
    image: rivus-batch
    restart: unless-stopped
    command: standalone
    environment: &batch-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/rivus/dags
      # Local only (port bound to 127.0.0.1): no login.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: rivus
      CLICKHOUSE_PASSWORD: rivus
      VENUES: coinbase kraken bitstamp
    ports:
      - "127.0.0.1:18082:8080"   # Airflow web UI
    volumes:
      - airflow-data:/opt/airflow
      - batch-data:/data
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------- tests
  batch-test:
    profiles: ["test"]
    image: rivus-batch
    pull_policy: never
    entrypoint: ["/bin/bash", "-c"]
    # ruff and pytest (which runs dbt for real) in the batch environment, then
    # a check that Airflow can load the DAG file.
    command:
      - cd /opt/rivus && /home/airflow/batch-venv/bin/ruff check . &&
        /home/airflow/batch-venv/bin/pytest -q -p no:cacheprovider &&
        python dags/reconcile.py && echo "DAG file loads"

  api-test:
    profiles: ["test"]
    build:
      context: ./api
      target: test
    image: rivus-api-test

  latest-test:
    profiles: ["test"]
    build:
      context: ./latest
      target: test
    image: rivus-latest-test

  flink-sql-test:
    profiles: ["test"]
    image: rivus-flink
    pull_policy: never
    entrypoint: ["/bin/bash", "/opt/flink/run-sql-tests.sh"]

  collectors-test:
    profiles: ["test"]
    build:
      context: ./collectors
      target: test
    image: rivus-collector-test

volumes:
  kafka-data:
  flink-state:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  airflow-data:
  batch-data:
